name: Build Hilton High Report Splitter

on:
  workflow_dispatch:
  push:
    paths:
      - "report_splitter.py"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    # The executable targets Windows 10 and newer.
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            "PyMuPDF==1.24.14" `
            "Pillow==10.4.0" `
            "openpyxl==3.1.5" `
            "python-docx==1.1.2" `
            "pyinstaller==6.11.1"

      - name: Build one-file Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --clean `
            --name HiltonHighReportSplitter `
            report_splitter.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: HiltonHighReportSplitter-Windows
          path: dist/HiltonHighReportSplitter.exe